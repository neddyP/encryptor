name: Release

# Builds the binaries for every platform, packs @neddyp/encryptor and
# publishes it to npm through trusted publishing. What a run does is decided
# by .github/release-plan.sh:
#
#   Monthly (1st, 09:17 UTC)  if files that go into the package changed since
#                             the last v* tag, bump the patch version, commit
#                             and tag it, and publish. Otherwise stop before
#                             building anything.
#   Push a v* tag             publish that version.
#   Run by hand               build and pack, then `npm publish --dry-run`,
#                             as the next patch version if this one is
#                             already on npm, so it can't fail for that.
#
# The packed tarball is kept as the `npm-package` artifact.
#
# Everything that runs here is pinned: actions to full commit SHAs, Rust and
# Node to exact versions, cross's build images to digests (Cross.toml), and
# crates to Cargo.lock (--locked). Update them deliberately, not by drifting.

on:
  schedule:
    - cron: "17 9 1 * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: write # monthly releases push the version bump and tag
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        run: .github/release-plan.sh
      - name: Push the release commit and tag
        if: github.event_name == 'schedule' && steps.plan.outputs.mode == 'publish'
        env:
          RELEASE_REF: ${{ steps.plan.outputs.ref }}
        run: git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$RELEASE_REF"

  build-linux:
    name: Build Linux (x64, arm64)
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Set the dry run's version
        if: needs.plan.outputs.mode == 'dry-run'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/set-version.sh "$VERSION"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cross@0.2.5
      # Static musl binaries run on any Linux distribution. The arm64 tests run
      # under emulation inside cross's container, using the pinned images in
      # Cross.toml. target/release holds build
      # scripts compiled inside the previous target's container, which may not
      # run in the next one, so it's cleared between targets.
      - name: Test and build
        run: |
          mkdir -p out
          for pair in x86_64-unknown-linux-musl:linux-x64 aarch64-unknown-linux-musl:linux-arm64; do
            target=${pair%%:*} platform=${pair##*:}
            rm -rf target/release
            cross test --release --locked --target "$target"
            cross build --release --locked --target "$target"
            cp "target/$target/release/encryptor" "out/encryptor-$platform"
          done
          file out/*
          out/encryptor-linux-x64 --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-linux
          path: out/
          if-no-files-found: error

  build-macos:
    name: Build macOS (x64, arm64)
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Set the dry run's version
        if: needs.plan.outputs.mode == 'dry-run'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/set-version.sh "$VERSION"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: 1.99.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and build
        run: |
          cargo test --release --locked
          mkdir -p out
          for pair in aarch64-apple-darwin:darwin-arm64 x86_64-apple-darwin:darwin-x64; do
            target=${pair%%:*} platform=${pair##*:}
            cargo build --release --locked --target "$target"
            cp "target/$target/release/encryptor" "out/encryptor-$platform"
          done
          file out/*
          if [ "$(uname -m)" = arm64 ]; then out/encryptor-darwin-arm64 --help; else out/encryptor-darwin-x64 --help; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-macos
          path: out/
          if-no-files-found: error

  publish:
    name: Pack and publish
    needs: [plan, build-linux, build-macos]
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Set the dry run's version
        if: needs.plan.outputs.mode == 'dry-run'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/set-version.sh "$VERSION"
      # Node 24.21.0 ships npm 11.19.0; trusted publishing needs 11.5.1 or later.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Stage and pack
        run: |
          npm/stage.sh binaries
          npm pack ./npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: neddyp-encryptor-*.tgz
          if-no-files-found: error
      # Provenance attestations aren't available for private repositories.
      - name: Publish
        if: needs.plan.outputs.mode == 'publish'
        run: npm publish ./neddyp-encryptor-*.tgz --provenance=false
      - name: Publish (dry run)
        if: needs.plan.outputs.mode == 'dry-run'
        run: npm publish ./neddyp-encryptor-*.tgz --provenance=false --dry-run
