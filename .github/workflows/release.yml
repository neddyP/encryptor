name: Release

# Builds the binaries for every platform, packs @neddyp/encryptor and
# publishes it to npm through trusted publishing. What a run does is decided
# by .github/release-plan.sh:
#
#   Monthly (1st, 09:17 UTC)  if files that go into the package changed since
#                             the last v* tag, bump the patch version, commit
#                             and tag it, and publish. Otherwise stop before
#                             building anything.
#   Push a v* tag             publish that version.
#   Run by hand               build and pack, then `npm publish --dry-run`.
#
# The packed tarball is kept as the `npm-package` artifact.

on:
  schedule:
    - cron: "17 9 1 * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: write # monthly releases push the version bump and tag
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: .github/release-plan.sh
      - name: Push the release commit and tag
        if: github.event_name == 'schedule' && steps.plan.outputs.mode == 'publish'
        run: git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/${{ steps.plan.outputs.ref }}"

  build-linux:
    name: Build Linux (x64, arm64)
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # Static musl binaries run on any Linux distribution. The arm64 tests run
      # under emulation inside cross's container. target/release holds build
      # scripts compiled inside the previous target's container, which may not
      # run in the next one, so it's cleared between targets.
      - name: Test and build
        run: |
          mkdir -p out
          for pair in x86_64-unknown-linux-musl:linux-x64 aarch64-unknown-linux-musl:linux-arm64; do
            target=${pair%%:*} platform=${pair##*:}
            rm -rf target/release
            cross test --release --target "$target"
            cross build --release --target "$target"
            cp "target/$target/release/aes256" "out/aes256-$platform"
          done
          file out/*
          out/aes256-linux-x64 --help
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux
          path: out/
          if-no-files-found: error

  build-macos:
    name: Build macOS (x64, arm64)
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and build
        run: |
          cargo test --release
          mkdir -p out
          for pair in aarch64-apple-darwin:darwin-arm64 x86_64-apple-darwin:darwin-x64; do
            target=${pair%%:*} platform=${pair##*:}
            cargo build --release --target "$target"
            cp "target/$target/release/aes256" "out/aes256-$platform"
          done
          file out/*
          if [ "$(uname -m)" = arm64 ]; then out/aes256-darwin-arm64 --help; else out/aes256-darwin-x64 --help; fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-macos
          path: out/
          if-no-files-found: error

  publish:
    name: Pack and publish
    needs: [plan, build-linux, build-macos]
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Update npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Stage and pack
        run: |
          npm/stage.sh binaries
          npm pack ./npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: neddyp-encryptor-*.tgz
          if-no-files-found: error
      # Provenance attestations aren't available for private repositories.
      - name: Publish
        if: needs.plan.outputs.mode == 'publish'
        run: npm publish ./neddyp-encryptor-*.tgz --provenance=false
      - name: Publish (dry run)
        if: needs.plan.outputs.mode == 'dry-run'
        run: npm publish ./neddyp-encryptor-*.tgz --provenance=false --dry-run
