[package]
name = "encryptor"
version = "2.5.1"
edition = "2024"
rust-version = "1.89"
description = "Encrypt and decrypt files with AES-256-GCM from the command line"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13"
libc = "0.2"
md-5 = "0.11"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9.0"

[profile.release]
lto = true
strip = true

# Argon2id takes 256 MiB and several passes for every passphrase, which
# unoptimised takes many seconds, so it's optimised in debug builds and tests
# too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
