[package]
name = "aes256"
version = "2.0.0"
edition = "2024"
description = "Encrypt and decrypt files with AES-256-GCM from the command line"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4.3"
libc = "0.2"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9.0"

[profile.release]
lto = true
strip = true
